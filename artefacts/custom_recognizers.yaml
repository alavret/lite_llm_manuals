# Кастомные распознаватели из guardrails-llm-filter (гайд 09).
# Готовый снапшот: 250 правил / 247 сущностей, язык ru.
# Сгенерировано scripts/convert_guardrails_rules.py (см. гайд 09, раздел 3).
# Источник: https://github.com/cloud-ru-tech/guardrails-llm-filter (configs/guardrails_regex_rules.yaml + configs/guardrails_regex_rules.gitleaks.generated.yaml) + 4 правила EXTRA_RULES
#
# Подключение — вариант БЕЗ Docker (venv):
#   1. cp custom_recognizers.yaml /etc/presidio/custom_recognizers.yaml
#   2. analyzer_server.py (пример: artefacts/analyzer_server.py) грузит файл
#      при старте и регистрирует распознаватели через analyzer.registry.add_recognizer.
#
# Подключение — вариант Docker:
#   допишите записи ниже (всё, что под ключом recognizers:) в КОНЕЦ списка
#   recognizer_registry.recognizers в analyzer-config.yml, ПОСЛЕ предустановленных
#   распознайзеров (если секция задана, Presidio грузит ТОЛЬКО перечисленное).
#
# Сущности для LiteLLM: artefacts/pii_entities_config.snippet.yaml.
# Пропущенные правила и адаптации: artefacts/conversion_report.md.
# Это снапшот на дату генерации — обновление правил только через конвертер.
recognizers:
- name: credentials.url_with_creds
  supported_entity: URL_WITH_CREDS
  patterns:
  - name: credentials.url_with_creds
    regex: (?i)((?:https?|ftp)://[^:\s@/\\]+:[^@\s/'"`,\\]{3,}@[^\s'"`\\,;!?()\[\]{}]*[^\s'"`\\,;.!?()\[\]{}])(?=[\x60'"\s,;.!?()\[\]{}]|\\[nr]|$)
    score: 0.8
  supported_languages:
  - ru
- name: credentials.db_connection
  supported_entity: DB_DSN
  patterns:
  - name: credentials.db_connection
    regex: (?i)((?:postgres(?:ql)?|mysql|mssql|mongodb(?:\+srv)?)://[^:@\s\\]+:[^@\s'"`\,\\]{3,}@[^\s'"`\,;!?()\[\]{}\\]*[^\s'"`\,;.!?()\[\]{}\\])(?=[\x60'"\s,;.!?()\[\]{}]|\\[nr]|$)
    score: 0.8
  supported_languages:
  - ru
- name: credentials.redis_connection
  supported_entity: REDIS_DSN
  patterns:
  - name: credentials.redis_connection
    regex: (?i)(redis(?:s)?://(?:[^:@/\s\\]*:)[^@\s/'"`?,#\\]{3,}@[^\s'"`\\,;!?()\[\]{}]*[^\s'"`\\,;.!?()\[\]{}])(?=[\x60'"\s,;.!?()\[\]{}]|\\[nr]|$)
    score: 0.8
  supported_languages:
  - ru
- name: credentials.amqp_connection
  supported_entity: AMQP_DSN
  patterns:
